services:
  api:
    build: .
    container_name: spacerescue-api
    ports:
        - "3000:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://admin:password@db:27017/spacerescue?authSource=admin
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mongo:latest
    container_name: spacerescue-db
    ports:
      - "27018:27017"
    environment:
        - MONGO_INITDB_ROOT_USERNAME=admin
        - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data: